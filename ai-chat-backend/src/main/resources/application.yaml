server:
  port: 8080

spring:
  # 数据库连接信息按本机环境修改
  datasource:
    url: jdbc:mysql://localhost:3306/ai_chat_db?useUnicode=true&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  spring:
    rabbitmq:
      host: 127.0.0.1
      port: 5672
